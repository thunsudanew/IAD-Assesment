<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IAD Assessment เด็ก</title>

<style>
body{font-family:Tahoma;background:#f5f6fa;}

.box{
  width:420px;
  margin:40px auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 0 12px rgba(0,0,0,0.15);
  text-align:center;
}

input,select{
  width:95%;
  padding:8px;
  margin:6px 0 12px 0;
  border-radius:6px;
  border:1px solid #ccc;
}

.age-box{display:flex;gap:10px;}
.age-box input{width:45%;}

.group{
  border:1px solid #ccc;
  border-radius:8px;
  padding:10px;
  text-align:left;
  margin-bottom:15px;
}

button{
  border:none;
  padding:12px 20px;
  font-size:16px;
  border-radius:8px;
  cursor:pointer;
  margin:8px;
}

.save{background:#27ae60;color:white;}
.care{background:#3498db;color:white;}
</style>

<script>

// ⭐ URL Web App ของคุณ
const scriptURL =
"https://script.google.com/macros/s/AKfycbx1CqfE0LbnXIFnrtW6lVwLOyhFpomJjbmhwDLXxodexMsue_mria6RDS_kmJ7xiJQtKQ/exec";

// ไม่มี → ปิดตัวเลือกอื่น
function noRiskToggle(){
  let none=document.getElementById("noneRisk");
  let others=document.getElementsByClassName("risk");

  for(let i=0;i<others.length;i++){
    others[i].disabled=none.checked;
    if(none.checked) others[i].checked=false;
  }
}

// 💾 บันทึกข้อมูลลง Google Sheet
function saveData(){

  let risks=[];
  document.querySelectorAll(".risk:checked")
    .forEach(el=>risks.push(el.value));

  if(document.getElementById("noneRisk").checked)
    risks=["ไม่มี"];

  let data={
    hn:document.getElementById("hn").value,
    sex:document.getElementById("sex").value,
    ageY:document.getElementById("ageY").value,
    ageM:document.getElementById("ageM").value,
    history:document.getElementById("history").value,
    risk:risks.join(", "),
    level:document.getElementById("skinLevel").value
  };

  fetch(scriptURL,{
    method:"POST",
    mode:"no-cors",
    headers:{
      "Content-Type":"application/x-www-form-urlencoded"
    },
    body:Object.keys(data)
      .map(k=>k+"="+encodeURIComponent(data[k]))
      .join("&")
  });

  alert("✅ ส่งข้อมูลแล้ว (ตรวจใน Google Sheet)");
}

// ➡️ ไปหน้าการดูแลตามระดับ
function goCare(){

  let level=document.getElementById("skinLevel").value;

  if(level=="ผิวหนังสมบูรณ์")
    window.location.href="care_intact.html";

  else if(level=="ระดับ 1 มีรอยแดง")
    window.location.href="care_level1.html";

  else if(level=="ระดับ 2 มีรอยถลอก")
    window.location.href="care_level2.html";
}

</script>

</head>

<body>

<div class="box">

<h2>👶 ระบบประเมิน IAD เด็ก</h2>

HN:<br>
<input id="hn">

เพศ:<br>
<select id="sex">
  <option>ชาย</option>
  <option>หญิง</option>
</select>

อายุ:<br>
<div class="age-box">
  <input id="ageY" type="number" placeholder="ปี">
  <input id="ageM" type="number" placeholder="เดือน">
</div>

ประวัติ IAD:<br>
<select id="history">
  <option>ไม่เคย</option>
  <option>เคย</option>
</select>

<h3>⚠️ ปัจจัยเสี่ยง</h3>

<div class="group">

<label><input type="checkbox" id="noneRisk" onclick="noRiskToggle()"> ไม่มี</label><br>

<label><input type="checkbox" class="risk" value="แผล/ผิวหนังอักเสบ"> แผล/ผิวหนังอักเสบ</label><br>
<label><input type="checkbox" class="risk" value="อุจจาระเหลว"> อุจจาระเหลว</label><br>
<label><input type="checkbox" class="risk" value="ถ่าย > 3 ครั้งใน 8 ชม."> ถ่าย > 3 ครั้งใน 8 ชม.</label><br>
<label><input type="checkbox" class="risk" value="อุจจาระเป็นน้ำ"> อุจจาระเป็นน้ำ</label><br>
<label><input type="checkbox" class="risk" value="ควบคุมการขับถ่ายไม่ได้"> ควบคุมการขับถ่ายไม่ได้</label><br>
<label><input type="checkbox" class="risk" value="เปียกชื้นทุก ≤ 2 ชม."> เปียกชื้นทุก ≤ 2 ชม.</label>

</div>

<h3>🩹 ระดับผิวหนัง</h3>

<select id="skinLevel">
  <option>ผิวหนังสมบูรณ์</option>
  <option>ระดับ 1 มีรอยแดง</option>
  <option>ระดับ 2 มีรอยถลอก</option>
</select>

<button class="save" onclick="saveData()">💾 บันทึกข้อมูล</button>

<button class="care" onclick="goCare()">➡️ ไปดูการดูแล</button>

</div>

</body>
</html>
